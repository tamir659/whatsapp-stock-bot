name = "whatsapp-stock-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fires every minute (Cloudflare Cron Triggers' minimum interval); the code itself
# skips the actual work outside US market hours (see src/stocks/market-hours.ts),
# so this is cheap the rest of the day. Still well within the free tier.
[triggers]
crons = ["* * * * *"]

# After running `wrangler d1 create watchlist-db`, paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "watchlist-db"
database_id = "618abca1-77b8-4429-b33d-75ae8ad00ac0"
