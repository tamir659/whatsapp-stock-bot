name = "whatsapp-stock-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fires every 5 minutes; the code itself skips the actual work outside US market
# hours (see src/stocks/market-hours.ts), so this is cheap the rest of the day.
[triggers]
crons = ["*/5 * * * *"]

# After running `wrangler d1 create watchlist-db`, paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "watchlist-db"
database_id = "618abca1-77b8-4429-b33d-75ae8ad00ac0"
